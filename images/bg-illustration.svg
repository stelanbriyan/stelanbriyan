<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="glow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glow-cyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft ambient glow -->
  <ellipse cx="1100" cy="180" rx="420" ry="280" fill="url(#glow-blue)"/>
  <ellipse cx="200" cy="720" rx="360" ry="240" fill="url(#glow-cyan)"/>

  <!-- Floating cloud shapes -->
  <g opacity="0.45" stroke="#60a5fa" stroke-width="1.2" fill="none">
    <path d="M980 120c-28 0-52 16-64 40-18-8-40-4-52 12-16 22-6 52 18 62 4 24 26 42 52 42h96c36 0 64-30 64-66s-28-66-64-66h-50z"/>
    <path d="M1180 280c-22 0-40 12-50 32-14-6-30-3-38 10-12 16-4 38 12 46 3 18 20 32 38 32h72c28 0 50-22 50-50s-22-50-50-50h-34z" opacity="0.7"/>
    <path d="M820 340c-18 0-34 10-42 26-10-4-22-2-28 8-10 12-4 28 10 34 2 12 16 22 30 22h58c22 0 40-18 40-40s-18-40-40-40h-28z" opacity="0.55"/>
  </g>

  <!-- Server / data-center blocks -->
  <g opacity="0.5">
    <rect x="1020" y="420" width="88" height="120" rx="8" stroke="#3b82f6" stroke-width="1.5" fill="rgba(59,130,246,0.08)"/>
    <line x1="1036" y1="448" x2="1092" y2="448" stroke="#60a5fa" stroke-width="1" opacity="0.6"/>
    <line x1="1036" y1="468" x2="1080" y2="468" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <line x1="1036" y1="488" x2="1092" y2="488" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
    <circle cx="1048" cy="512" r="4" fill="#3b82f6" opacity="0.7"/>
    <circle cx="1064" cy="512" r="4" fill="#22d3ee" opacity="0.5"/>

    <rect x="1140" y="460" width="72" height="96" rx="6" stroke="#3b82f6" stroke-width="1.2" fill="rgba(59,130,246,0.06)"/>
    <line x1="1154" y1="484" x2="1198" y2="484" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
    <line x1="1154" y1="502" x2="1188" y2="502" stroke="#60a5fa" stroke-width="1" opacity="0.35"/>
    <circle cx="1166" cy="528" r="3" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Network nodes & connections -->
  <g opacity="0.55" stroke="#3b82f6" stroke-width="1">
    <line x1="1064" y1="420" x2="920" y2="320" opacity="0.4"/>
    <line x1="1108" y1="540" x2="980" y2="620" opacity="0.35"/>
    <line x1="1176" y1="508" x2="1240" y2="400" opacity="0.3"/>
    <line x1="920" y1="320" x2="780" y2="380" opacity="0.25"/>
    <line x1="980" y1="620" x2="860" y2="700" opacity="0.2"/>
    <line x1="1240" y1="400" x2="1320" y2="340" opacity="0.25"/>
  </g>

  <g opacity="0.7">
    <circle cx="920" cy="320" r="8" fill="url(#orb)"/>
    <circle cx="920" cy="320" r="4" fill="#60a5fa"/>
    <circle cx="780" cy="380" r="6" fill="#3b82f6" opacity="0.6"/>
    <circle cx="980" cy="620" r="7" fill="#38bdf8" opacity="0.5"/>
    <circle cx="1240" cy="400" r="6" fill="#60a5fa" opacity="0.55"/>
    <circle cx="1320" cy="340" r="5" fill="#3b82f6" opacity="0.45"/>
    <circle cx="860" cy="700" r="5" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- Code brackets accent -->
  <g opacity="0.25" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M140 200 L100 240 L140 280"/>
    <path d="M220 200 L260 240 L220 280"/>
    <path d="M160 360 L120 400 L160 440" opacity="0.6"/>
    <path d="M200 360 L240 400 L200 440" opacity="0.6"/>
  </g>

  <!-- Circuit traces (bottom left) -->
  <g opacity="0.3" stroke="#3b82f6" stroke-width="1" fill="none">
    <path d="M60 600 H180 V680 H300"/>
    <path d="M120 640 H240 V760 H360"/>
    <circle cx="180" cy="680" r="4" fill="#3b82f6"/>
    <circle cx="240" cy="760" r="3" fill="#38bdf8"/>
    <circle cx="300" cy="680" r="3" fill="#60a5fa"/>
  </g>

  <!-- Hex grid accent (top left) -->
  <g opacity="0.15" stroke="#60a5fa" stroke-width="0.8" fill="none">
    <polygon points="320,80 340,92 340,116 320,128 300,116 300,92"/>
    <polygon points="360,100 380,112 380,136 360,148 340,136 340,112"/>
    <polygon points="400,80 420,92 420,116 400,128 380,116 380,92"/>
    <polygon points="340,140 360,152 360,176 340,188 320,176 320,152"/>
  </g>

  <!-- AI / neural dots -->
  <g opacity="0.35">
    <circle cx="600" cy="200" r="3" fill="#60a5fa"/>
    <circle cx="640" cy="170" r="2.5" fill="#38bdf8"/>
    <circle cx="680" cy="210" r="3" fill="#3b82f6"/>
    <circle cx="620" cy="240" r="2" fill="#93c5fd"/>
    <circle cx="660" cy="250" r="2.5" fill="#60a5fa"/>
    <line x1="600" y1="200" x2="640" y2="170" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
    <line x1="640" y1="170" x2="680" y2="210" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
    <line x1="600" y1="200" x2="620" y2="240" stroke="#3b82f6" stroke-width="0.8" opacity="0.4"/>
    <line x1="680" y1="210" x2="660" y2="250" stroke="#3b82f6" stroke-width="0.8" opacity="0.4"/>
    <line x1="620" y1="240" x2="660" y2="250" stroke="#3b82f6" stroke-width="0.8" opacity="0.35"/>
  </g>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="750" x2="1440" y2="750"/>
    <line x1="240" y1="0" x2="240" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="720" y1="0" x2="720" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>
</svg>
